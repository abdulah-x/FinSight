<!doctype html>
<html lang="en" data-api="http://localhost:8000">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinSight Bias Desk</title>
  <meta name="description" content="An AI agent that reads the evidence for Bitcoin, Ethereum and gold and gives a directional bias with an evidence score.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <canvas id="bgArt" aria-hidden="true"></canvas>
  <div class="desk">
    <section class="hero">
      <div>
        <div class="brand"><span class="logo">Fin<span>Sight</span></span><span class="kicker">AI market agent</span></div>
        <h1>Ask for a bias. The agent gathers the evidence and shows its work.</h1>
        <p>Direction and evidence for Bitcoin, Ethereum and gold, with the level where the view stops holding. Bias only, never trade calls.</p>
      </div>
    </section>

    <section class="task" aria-label="Give the agent a task">
      <form id="taskForm">
        <input type="text" id="task" maxlength="500" autocomplete="off" placeholder="Give the agent a task, e.g. “Gold daily bias” or “why is it bearish?”" aria-label="Task for the agent">
        <button class="run" id="runBtn" type="submit">Run agent</button>
      </form>
      <div class="picks">
        <div class="chipset" id="assetPicks" role="group" aria-label="Asset"></div>
        <div class="chipset" id="tfPicks" role="group" aria-label="Timeframe"></div>
      </div>
    </section>

    <section class="work">
      <aside class="log" aria-label="Agent run">
        <div class="log-head"><span class="label">Agent run</span><span class="st-time" id="runTotal"></span></div>
        <ol class="steps" id="steps" aria-live="polite"></ol>
        <div class="log-foot"><span class="label">Earlier runs</span><ul class="past" id="past"></ul></div>
      </aside>
      <main id="result" aria-live="polite"></main>
    </section>
  </div>
</body>
</html>
