<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FinSight — Financial Research Agent</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-alt: #1e222b;
    --border: #2a2f3a;
    --text: #e8eaed;
    --text-dim: #9aa2b1;
    --accent: #4f8cff;
    --accent-dim: #2f4d8f;
    --user-bubble: #2b5cff;
    --success: #2ecc71;
    --error: #ff5c5c;
    --radius: 14px;
    --sidebar-w: 260px;
  }

  * { box-sizing: border-box; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: linear-gradient(180deg, var(--bg), #0a0c10 60%);
    color: var(--text);
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
  }

  .layout {
    display: flex;
    width: 100%;
    height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: #0c0e12;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px 12px;
    transition: transform 0.2s ease;
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 4px 16px;
  }

  .logo {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #7b5cff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.95rem;
    flex-shrink: 0;
  }

  .sidebar-header h1 {
    font-size: 1.05rem;
    margin: 0;
    letter-spacing: -0.02em;
  }

  .new-chat-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    font-size: 0.85rem;
    font-weight: 600;
    border-radius: 9px;
    width: 100%;
    margin-bottom: 12px;
  }
  .new-chat-btn:hover { background: var(--panel); border-color: var(--accent-dim); }

  .conversation-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .conversation-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .conversation-item:hover { background: var(--panel); }
  .conversation-item.active {
    background: var(--panel-alt);
    border-color: var(--accent-dim);
  }
  .conversation-item .conv-title {
    font-size: 0.85rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }
  .conversation-item .conv-time {
    font-size: 0.72rem;
    color: var(--text-dim);
  }

  .sidebar-empty {
    color: var(--text-dim);
    font-size: 0.82rem;
    padding: 10px;
    text-align: center;
  }

  .sidebar-toggle {
    display: none;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.9rem;
  }

  /* ---------- Main column ---------- */
  .main {
    flex: 1;
    display: flex;
    justify-content: center;
    padding: 0 24px;
    min-width: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .app {
    width: 100%;
    max-width: 1280px;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding: 32px 0 20px;
    transition: justify-content 0.2s ease;
  }

  .app.empty {
    justify-content: center;
  }

  .mobile-header {
    display: none;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  form {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    padding-top: 12px;
    flex-shrink: 0;
    position: sticky;
    bottom: 0;
    background: var(--bg);
  }

  input {
    flex: 1;
    padding: 13px 16px;
    font-size: 1rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--text-dim); }

  button {
    padding: 0 22px;
    font-size: 0.98rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    transition: background 0.15s, transform 0.05s;
  }
  button:hover { background: #6b9dff; }
  button:active { transform: scale(0.97); }
  button:disabled { background: var(--accent-dim); cursor: not-allowed; }

  .chat {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .bubble {
    border-radius: var(--radius);
    padding: 14px 18px;
    max-width: 100%;
    line-height: 1.55;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bubble.user {
    align-self: flex-end;
    max-width: 70%;
    background: var(--user-bubble);
    color: white;
    border-bottom-right-radius: 4px;
    font-weight: 500;
  }

  .bubble.agent {
    align-self: stretch;
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .bubble.agent .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
  }

  .bubble.agent .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
  }

  .report h3 {
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent);
    margin: 18px 0 8px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  .report h3:first-child { margin-top: 0; }

  .report ul {
    margin: 0 0 4px;
    padding-left: 20px;
  }
  .report li { margin-bottom: 6px; color: var(--text); }
  .report p { margin: 0 0 8px; }
  .report strong { color: #fff; }
  .report em { color: var(--text-dim); }
  .report a { color: var(--accent); text-decoration: none; }
  .report a:hover { text-decoration: underline; }
  .report hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 18px 0;
  }

  .table-wrap {
    overflow-x: auto;
    margin: 4px 0 14px;
  }
  .report table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  .report th, .report td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    white-space: nowrap;
  }
  .report th {
    color: var(--text-dim);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-weight: 700;
  }
  .report tbody tr:hover { background: var(--panel-alt); }

  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin: 4px 0 4px;
  }
  .metric {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .metric .label {
    font-size: 0.72rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 4px;
  }
  .metric .value {
    font-size: 1rem;
    font-weight: 700;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-dim);
    font-size: 0.9rem;
    padding: 10px 4px;
  }

  .typing-dots {
    display: flex;
    gap: 3px;
  }
  .typing-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .error-bubble {
    color: var(--error);
    font-weight: 500;
  }

  .empty-state {
    color: var(--text-dim);
    text-align: center;
    padding: 60px 20px;
    font-size: 0.95rem;
  }

  .sentiment-tally {
    display: flex;
    gap: 8px;
    margin: 4px 0 14px;
    flex-wrap: wrap;
  }
  .sentiment-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 700;
    border: 1px solid var(--border);
    background: var(--panel-alt);
  }
  .sentiment-chip.bullish { color: var(--success); border-color: rgba(46, 204, 113, 0.3); }
  .sentiment-chip.bearish { color: var(--error); border-color: rgba(255, 92, 92, 0.3); }
  .sentiment-chip.neutral { color: var(--text-dim); }

  @media (max-width: 800px) {
    .sidebar {
      position: fixed;
      z-index: 20;
      top: 0;
      left: 0;
      height: 100vh;
      transform: translateX(-100%);
      box-shadow: 2px 0 24px rgba(0,0,0,0.4);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-toggle { display: inline-flex; }
    .mobile-header { display: flex; }
    .main { padding: 20px 14px; }
  }

  @media (max-width: 480px) {
    form { flex-direction: column; }
    button { padding: 12px; width: 100%; }
    .bubble { padding: 12px 14px; }
    .metrics-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">F</div>
        <h1>FinSight</h1>
      </div>
      <button type="button" class="new-chat-btn" id="newChatBtn">+ New Chat</button>
      <div class="conversation-list" id="conversationList"></div>
    </aside>

    <div class="main" id="mainCol">
      <div class="app empty" id="app">
        <div class="mobile-header">
          <button type="button" class="sidebar-toggle" id="sidebarToggle">☰</button>
          <h1 style="font-size:1.1rem;margin:0;">FinSight</h1>
        </div>
        <div class="chat" id="chat">
          <div class="empty-state" id="emptyState">Ask about a company or crypto asset to generate a research report.</div>
        </div>

        <form id="form">
          <input id="query" placeholder="Ask about a company or ticker, e.g. Apple or AAPL" autocomplete="off" required />
          <button type="submit" id="submitBtn">Research</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const BACKEND_URL = window.FINSIGHT_BACKEND_URL || "http://localhost:8000";
    const STORAGE_KEY = "finsight_conversations";
    const EMPTY_STATE_HTML = '<div class="empty-state" id="emptyState">Ask about a company or crypto asset to generate a research report.</div>';

    const app = document.getElementById("app");
    const mainCol = document.getElementById("mainCol");
    const chat = document.getElementById("chat");
    const submitBtn = document.getElementById("submitBtn");
    const conversationList = document.getElementById("conversationList");
    const sidebar = document.getElementById("sidebar");

    function setEmptyMode(isEmpty) {
      app.classList.toggle("empty", isEmpty);
    }

    // ---------- Conversation storage ----------
    function loadConversations() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveConversations(conversations) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
    }

    function makeConversation() {
      return { id: crypto.randomUUID(), title: null, createdAt: Date.now(), turns: [] };
    }

    let conversations = loadConversations();
    let activeId;

    function getActive() {
      return conversations.find((c) => c.id === activeId);
    }

    function persistActiveTurn(turn) {
      const conv = getActive();
      if (!conv) return;
      conv.turns.push(turn);
      if (!conv.title && turn.type === "user") {
        conv.title = turn.text.slice(0, 42) + (turn.text.length > 42 ? "…" : "");
      }
      saveConversations(conversations);
      renderSidebar();
    }

    function relativeTime(ts) {
      const diffMin = Math.round((Date.now() - ts) / 60000);
      if (diffMin < 1) return "just now";
      if (diffMin < 60) return `${diffMin}m ago`;
      const diffH = Math.round(diffMin / 60);
      if (diffH < 24) return `${diffH}h ago`;
      return new Date(ts).toLocaleDateString();
    }

    function renderSidebar() {
      if (!conversations.length) {
        conversationList.innerHTML = '<div class="sidebar-empty">No conversations yet</div>';
        return;
      }
      const sorted = [...conversations].sort((a, b) => b.createdAt - a.createdAt);
      conversationList.innerHTML = sorted
        .map((c) => {
          const title = c.title || "New conversation";
          const activeClass = c.id === activeId ? " active" : "";
          return `<div class="conversation-item${activeClass}" data-id="${c.id}">
            <div class="conv-title">${escapeHtml(title)}</div>
            <div class="conv-time">${relativeTime(c.createdAt)}</div>
          </div>`;
        })
        .join("");

      conversationList.querySelectorAll(".conversation-item").forEach((el) => {
        el.addEventListener("click", () => {
          switchConversation(el.dataset.id);
          closeSidebarOnMobile();
        });
      });
    }

    function switchConversation(id) {
      const conv = conversations.find((c) => c.id === id);
      if (!conv) return;
      activeId = id;
      chat.innerHTML = "";
      if (!conv.turns.length) {
        chat.innerHTML = EMPTY_STATE_HTML;
        setEmptyMode(true);
      } else {
        for (const turn of conv.turns) {
          if (turn.type === "user") addUserBubble(turn.text);
          else if (turn.type === "error") addErrorBubble(turn.text);
          else addAgentBubble(turn.reportMd, turn.marketData, turn.intent, turn.socialPosts);
        }
        setEmptyMode(false);
      }
      renderSidebar();
      mainCol.scrollTop = mainCol.scrollHeight;
    }

    function startNewConversation() {
      const conv = makeConversation();
      conversations.push(conv);
      saveConversations(conversations);
      activeId = conv.id;
      chat.innerHTML = EMPTY_STATE_HTML;
      setEmptyMode(true);
      renderSidebar();
    }

    function closeSidebarOnMobile() {
      sidebar.classList.remove("open");
    }

    // ---------- Rendering helpers ----------
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    function inlineFormat(text) {
      let out = escapeHtml(text);
      out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, "<em>$1</em>");
      return out;
    }

    function isTableRow(line) {
      return line.startsWith("|") && line.endsWith("|");
    }

    function isTableSeparatorRow(line) {
      return /^\|[\s:|-]+\|$/.test(line);
    }

    function splitTableRow(line) {
      return line.slice(1, -1).split("|").map((cell) => cell.trim());
    }

    function renderMarkdown(md) {
      const lines = md.split("\n");
      let html = "";
      let inList = false;
      let tableRows = null;

      const flushList = () => {
        if (inList) { html += "</ul>"; inList = false; }
      };
      const flushTable = () => {
        if (!tableRows) return;
        const [headerRow, ...bodyRows] = tableRows;
        html += "<div class=\"table-wrap\"><table>";
        html += "<thead><tr>" + headerRow.map((c) => `<th>${inlineFormat(c)}</th>`).join("") + "</tr></thead>";
        if (bodyRows.length) {
          html += "<tbody>" + bodyRows.map((row) =>
            "<tr>" + row.map((c) => `<td>${inlineFormat(c)}</td>`).join("") + "</tr>"
          ).join("") + "</tbody>";
        }
        html += "</table></div>";
        tableRows = null;
      };

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) continue;

        if (isTableRow(line)) {
          flushList();
          if (isTableSeparatorRow(line)) continue;
          if (!tableRows) tableRows = [];
          tableRows.push(splitTableRow(line));
          continue;
        }
        flushTable();

        if (/^-{3,}$/.test(line)) {
          flushList();
          html += "<hr>";
        } else if (line.startsWith("### ")) {
          flushList();
          html += `<h3>${inlineFormat(line.slice(4))}</h3>`;
        } else if (line.startsWith("## ")) {
          flushList();
          html += `<h3>${inlineFormat(line.slice(3))}</h3>`;
        } else if (line.startsWith("# ")) {
          flushList();
          html += `<h3>${inlineFormat(line.slice(2))}</h3>`;
        } else if (line.startsWith("* ") || line.startsWith("- ")) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += `<li>${inlineFormat(line.slice(2))}</li>`;
        } else {
          flushList();
          html += `<p>${inlineFormat(line)}</p>`;
        }
      }
      flushList();
      flushTable();
      return html;
    }

    function metricsGrid(marketData) {
      if (!marketData) return "";
      const entries = [
        ["Price", marketData.price != null ? `${marketData.currency || ""} ${marketData.price}` : null],
        ["Market Cap", marketData.market_cap != null ? formatLargeNumber(marketData.market_cap) : null],
        ["P/E Ratio", marketData.pe_ratio != null ? Number(marketData.pe_ratio).toFixed(2) : null],
        ["52W High", marketData["52_week_high"]],
        ["52W Low", marketData["52_week_low"]],
        ["Sector", marketData.sector],
      ].filter(([, v]) => v !== null && v !== undefined);

      if (!entries.length) return "";
      const cards = entries.map(([label, value]) =>
        `<div class="metric"><div class="label">${label}</div><div class="value">${value}</div></div>`
      ).join("");
      return `<div class="metrics-grid">${cards}</div>`;
    }

    function formatLargeNumber(n) {
      if (n >= 1e12) return (n / 1e12).toFixed(2) + "T";
      if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
      if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
      return n.toLocaleString();
    }

    function addUserBubble(text) {
      const el = document.createElement("div");
      el.className = "bubble user";
      el.textContent = text;
      chat.appendChild(el);
    }

    function addStatusBubble() {
      const el = document.createElement("div");
      el.className = "status";
      el.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div> Researching...`;
      chat.appendChild(el);
      return el;
    }

    function sentimentTally(socialPosts) {
      if (!socialPosts || !socialPosts.length) return "";
      const counts = { Bullish: 0, Bearish: 0, neutral: 0 };
      for (const p of socialPosts) {
        const s = p.sentiment;
        if (s === "Bullish") counts.Bullish++;
        else if (s === "Bearish") counts.Bearish++;
        else counts.neutral++;
      }
      const chips = [];
      if (counts.Bullish) chips.push(`<span class="sentiment-chip bullish">▲ ${counts.Bullish} Bullish</span>`);
      if (counts.Bearish) chips.push(`<span class="sentiment-chip bearish">▼ ${counts.Bearish} Bearish</span>`);
      if (counts.neutral) chips.push(`<span class="sentiment-chip neutral">${counts.neutral} Neutral</span>`);
      return `<div class="sentiment-tally">${chips.join("")}</div>`;
    }

    function addAgentBubble(reportMd, marketData, intent, socialPosts) {
      const label = intent === "quick_news" ? "Quick Answer" : "Full Report";
      const el = document.createElement("div");
      el.className = "bubble agent";
      el.innerHTML = `
        <div class="badge"><span class="dot"></span>${label}</div>
        ${metricsGrid(marketData)}
        ${sentimentTally(socialPosts)}
        <div class="report">${renderMarkdown(reportMd)}</div>
      `;
      chat.appendChild(el);
    }

    function addErrorBubble(message) {
      const el = document.createElement("div");
      el.className = "bubble agent error-bubble";
      el.innerHTML = `<div class="badge"><span class="dot" style="background:var(--error)"></span>FinSight Agent</div>${escapeHtml(message)}`;
      chat.appendChild(el);
    }

    // ---------- Form submit ----------
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("query");
      const query = input.value.trim();
      if (!query) return;

      const emptyState = document.getElementById("emptyState");
      if (emptyState) emptyState.remove();
      setEmptyMode(false);
      addUserBubble(query);
      persistActiveTurn({ type: "user", text: query });
      input.value = "";
      submitBtn.disabled = true;
      const statusEl = addStatusBubble();
      mainCol.scrollTop = mainCol.scrollHeight;

      try {
        const res = await fetch(`${BACKEND_URL}/research`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, session_id: activeId }),
        });
        const data = await res.json();
        statusEl.remove();

        if (data.error) {
          addErrorBubble(data.error);
          persistActiveTurn({ type: "error", text: data.error });
        } else {
          addAgentBubble(data.report, data.market_data, data.intent, data.social_posts);
          persistActiveTurn({
            type: "agent",
            reportMd: data.report,
            marketData: data.market_data,
            intent: data.intent,
            socialPosts: data.social_posts,
          });
        }
      } catch (err) {
        statusEl.remove();
        const msg = `Request failed: ${err.message}`;
        addErrorBubble(msg);
        persistActiveTurn({ type: "error", text: msg });
      } finally {
        submitBtn.disabled = false;
        mainCol.scrollTop = mainCol.scrollHeight;
      }
    });

    document.getElementById("newChatBtn").addEventListener("click", () => {
      startNewConversation();
      closeSidebarOnMobile();
      document.getElementById("query").focus();
    });

    document.getElementById("sidebarToggle").addEventListener("click", () => {
      sidebar.classList.toggle("open");
    });

    // ---------- Init ----------
    if (conversations.length) {
      activeId = [...conversations].sort((a, b) => b.createdAt - a.createdAt)[0].id;
      switchConversation(activeId);
    } else {
      startNewConversation();
    }
  </script>
</body>
</html>
