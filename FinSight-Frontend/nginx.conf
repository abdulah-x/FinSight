server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;  # don't advertise the nginx version

    # Content-Security-Policy: even if some text slipped through escaping, the browser
    # refuses to load scripts from anywhere else, send data anywhere but the API, or
    # let another site frame this page. No 'unsafe-inline': the JS and CSS live in their
    # own files, so an injected <script> or style attribute is refused outright.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # The API lives behind this same address, so only the web port faces the internet.
    location /api/ {
        proxy_pass http://finsight-backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;  # replaced, not appended: clients can't fake it for rate limits
        proxy_buffering off;       # the run log streams step by step
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
