server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;  # don't advertise the nginx version

    # Content-Security-Policy: even if some text slipped through escaping, the browser
    # refuses to load scripts from anywhere else, send data anywhere but the API, or
    # let another site frame this page. No 'unsafe-inline': the JS and CSS live in their
    # own files, so an injected <script> or style attribute is refused outright.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' http://localhost:8000; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri /index.html;
    }
}
