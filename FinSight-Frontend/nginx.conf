server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;  # don't advertise the nginx version

    # Content-Security-Policy: even if some text slipped through escaping, the browser
    # refuses to load scripts from anywhere else, send data anywhere but the API, or
    # let another site frame this page. 'unsafe-inline' is needed while the app's JS
    # lives inline in index.html (moved to its own file in Stage 8, then removed).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:8000; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri /index.html;
    }
}
